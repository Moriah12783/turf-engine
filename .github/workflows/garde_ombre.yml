name: Garde de confidentialité de l'ombre

# Contrôle indépendant décidé par Steph le 07/10/2026. Chaque nuit, il
# cherche toute trace de l'ombre du fondamental dans ce qui est public : le
# site publié, les fichiers publics du dépôt (site/, benchmark_report.json,
# benchmark_dashboard.html) et les lignes ajoutées à ces fichiers par les
# commits des 26 dernières heures (une journée entière, avec recouvrement). Il
# en faut zéro.
# Lancement : horloge Cloudflare à 01h17 UTC jusqu'au 25/11 (turf-horloge, à
# la minute), puis les horaires GitHub ci-dessous, souvent avec plusieurs
# heures de retard.
# Il ne touche pas à la chaîne de production : aucune écriture, aucun secret,
# aucune lecture de la base. Il n'imprime jamais d'extrait, seulement des
# comptes. Une trace trouvée fait échouer le job : GitHub envoie l'alerte.
# Marqueurs : clé de l'archive de l'ombre (docs/OMBRE_FONDAMENTAL.md) et, à
# partir du 25/11, clé du témoin NVE de la recette A en production, qui ne
# doit rien laisser paraître avant la lecture unique de la règle d'arrêt
# (docs/REGLE_ARRET.md). La recette et le préfixe de model_version sont des
# identifiants de production à partir du 30/11 : ils ne sont plus cherchés.
# tests/test_garde_ombre.py vérifie les marqueurs. Voir turf_lab/garde_ombre.py.

on:
  schedule:
    - cron: "41 7 * * *"
    - cron: "41 19 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "turf_lab/garde_ombre.py"
      - ".github/workflows/garde_ombre.yml"

permissions:
  contents: read

concurrency:
  group: garde-ombre
  cancel-in-progress: false

jobs:
  garde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout Repository (recent history included)
        uses: actions/checkout@v4
        with:
          fetch-depth: 150

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Search everything public for any trace of the shadow
        run: >-
          python -m turf_lab.garde_ombre
          --site https://prono.elite-turf.fr
          --heures 26
          --marqueur ombre_fondamental
          --marqueur temoin_nve

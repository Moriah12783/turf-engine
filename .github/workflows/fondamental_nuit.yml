name: Fondamental de nuit (ombre NVE)

# Règle arrêtée avec le dev NVE le 28/09/2026, GELÉE le 07/10/2026
# (docs/OMBRE_FONDAMENTAL.md) : DEBUT_OMBRE = 2026-10-08. Le lancement est
# fait par l'horloge Cloudflare (turf-horloge) à 05h05 et 05h50 UTC, du 08/10
# au 24/11. Les horaires GitHub ci-dessous, sur les mêmes jours, ne sont qu'un
# filet : ils partent souvent avec plusieurs heures de retard. Un horaire
# GitHub parti après la limite d'écriture du jour ne calcule rien et n'envoie
# rien (FILET_HORS_DELAI) : le passage de l'horloge du matin fait foi.
# Nuit : miroir historique (R2 privé, lecture seule) + programme PMU du jour
# -> table fundamental_probs de turf_bench.db, entre le pull et le push R2.
# Limites du jour, lues dans turf_lab/plancher_matin.py (source unique) :
# aucune écriture après le plancher du matin − 10 min ni pour une course déjà
# verrouillée, aucun push après le plancher − 2 min. Plancher : 06h30 UTC
# jusqu'au 22/11/2026, 08h30 heure de Paris à partir du 23/11/2026 (07h30 UTC
# en hiver). Refus par défaut : si le module ne répond pas explicitement
# (import en échec, Python absent, sortie illisible), rien n'est calculé par
# le filet et rien n'est envoyé. L'horloge Cloudflare reste en UTC. Le passage
# de 05h50 refait le calcul (historique le plus frais) et remplace celui de
# 05h05.
# Sur une PR : parité PMU <-> Radar et essai sur le programme du lendemain,
# dans une COPIE locale de la base (lecture seule, jamais renvoyée).
# Dépôt public : journal = agrégats seulement ; aucun artefact, aucun commit.
# Voir turf_lab/fondamental_nuit.py.

on:
  schedule:
    - cron: "5 5 8-31 10 *"
    - cron: "50 5 8-31 10 *"
    - cron: "5 5 1-24 11 *"
    - cron: "50 5 1-24 11 *"
  workflow_dispatch:
    inputs:
      action:
        description: "parite | essai | nuit"
        required: false
        default: "parite"
  pull_request:
    paths:
      - "turf_lab/fondamental_nuit.py"
      - ".github/workflows/fondamental_nuit.yml"

permissions:
  contents: read

concurrency:
  group: fondamental-nuit
  cancel-in-progress: false

jobs:
  nuit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ACTION: ${{ github.event_name == 'schedule' && 'nuit' || (github.event_name == 'pull_request' && 'controle' || github.event.inputs.action) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Late GitHub safety net (schedule started after the write limit of the day) - nothing to do
        if: github.event_name == 'schedule'
        run: |
          # Refus par défaut : seule une réponse explicite du module autorise le calcul.
          if verdict=$(python -m turf_lab.plancher_matin ecriture) && [[ "$verdict" == "ECRITURE_AUTORISEE "* ]]; then
            echo "$verdict"
          else
            echo "FILET_HORS_DELAI : horaire GitHub parti à $(date -u +%H:%M) UTC, hors de la limite d'écriture du jour (${verdict:-aucune réponse de plancher_matin}). Rien n'est calculé ni envoyé ; le passage de l'horloge Cloudflare fait foi."
            echo "FILET_HORS_DELAI=1" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.FILET_HORS_DELAI != '1'
        run: pip install -q --retries 10 --timeout 60 "numpy>=1.26,<3" "boto3>=1.36,<2"

      - name: Fetch the private history mirror from R2 (read-only)
        if: env.FILET_HORS_DELAI != '1'
        run: python -m turf_lab.history_export fetch --db turf_history.db

      - name: Parity PMU programme <-> Radar mirror (read-only)
        if: env.ACTION == 'parite' || env.ACTION == 'controle'
        run: python -m turf_lab.fondamental_nuit parite --historique turf_history.db

      - name: Trial on tomorrow's programme, local copy of the bench (never pushed)
        if: env.ACTION == 'essai' || env.ACTION == 'controle'
        run: |
          python -m turf_lab.r2_store fetch --db copie_banc.db
          python -m turf_lab.fondamental_nuit essai --historique turf_history.db --banc copie_banc.db --jour demain

      - name: Pull the bench from R2 (night only)
        if: env.ACTION == 'nuit' && env.FILET_HORS_DELAI != '1'
        run: python -m turf_lab.r2_store pull --db turf_bench.db

      - name: Compute and write fundamental_probs (night only)
        if: env.ACTION == 'nuit' && env.R2_MODE == 'r2' && env.FILET_HORS_DELAI != '1'
        run: python -m turf_lab.fondamental_nuit nuit --historique turf_history.db --banc turf_bench.db

      - name: Push the bench to R2 (night only, before the send limit of the day)
        if: env.ACTION == 'nuit' && env.R2_MODE == 'r2' && env.FILET_HORS_DELAI != '1'
        run: |
          # Refus par défaut : seule une réponse explicite du module autorise l'envoi.
          if verdict=$(python -m turf_lab.plancher_matin envoi) && [[ "$verdict" == "ENVOI_AUTORISE "* ]]; then
            echo "$verdict"
          else
            echo "PUSH_REFUSE_HEURE : trop près du verrou du matin, ou limite d'envoi illisible (${verdict:-aucune réponse de plancher_matin}) ; rien n'est envoyé."
            exit 1
          fi
          python -m turf_lab.r2_store push --db turf_bench.db

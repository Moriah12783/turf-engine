name: Labo Benter (fondamental + combinaison, walk-forward)

# Lit le miroir PRIVÉ de l'historique Radar sur R2 (lecture seule, empreinte
# vérifiée), entraîne et juge le modèle fondamental, puis dépose le rapport
# complet sur R2 privé (lab/benter/). Dépôt public : le journal n'affiche que
# des agrégats par mois (aucun cheval, aucune course, aucun coefficient) ;
# aucun artefact ; aucun commit ; aucune requête au Radar ; aucun effet sur la
# production. Voir docs/LABO_BENTER.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "turf_lab/benter_lab.py"
      - ".github/workflows/benter_lab.yml"

permissions:
  contents: read

concurrency:
  group: benter-lab
  cancel-in-progress: true

jobs:
  labo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -q "numpy>=1.26,<3" "boto3>=1.36,<2"

      - name: Fetch the private history mirror from R2
        run: python -m turf_lab.history_export fetch --db turf_history.db

      - name: Run the Benter lab (report goes to private R2 only)
        run: python -m turf_lab.benter_lab --db turf_history.db

name: Turf Engine 24/7 Cloud Sync & Deploy

on:
  schedule:
    # Matin : 08h30 GMT — Préparation Matin (fenêtre 7 jours, verrouillage T_MATIN)
    - cron: '30 8 * * *'
    # Passes LIVE : toutes les ~15 min de 09h à 20h59 GMT (jour de courses).
    # Chaque passe verrouille automatiquement les horizons atteints (T-90, T-30, T-15)
    # course par course, met à jour les cotes en direct et rapatrie les arrivées.
    # Les minutes décalées (6,21,36,51) évitent les pics de charge GitHub (crons à :00).
    - cron: '6,21,36,51 9-20 * * *'
    # Soir : 21h30 GMT — Consolidation des arrivées & Bilans (fenêtre 7 jours)
    - cron: '30 21 * * *'
  workflow_dispatch: # Déclenchement manuel 1-clic depuis smartphone ou PC
    inputs:
      verify_days:
        description: "Re-vérification des arrivées PMU sur N jours (vide = passe normale). 1 requête par jour, aucun pronostic touché."
        required: false
        default: ""

permissions:
  contents: write

# Un seul sync à la fois : les runs se mettent en file d'attente au lieu de
# s'exécuter en parallèle (protège la base de données contre les écrasements).
concurrency:
  group: turf-sync
  cancel-in-progress: false

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    # Garde-fou anti-blocage : un run coincé est tué après 12 minutes au lieu
    # de bloquer la file d'attente (concurrency) pendant des heures — cause du
    # silence de 2h18 constaté le 01/09 entre 17h51 et 20h09.
    timeout-minutes: 12
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore Database from Cloudflare R2 (étape 1 — sortie de GitHub)
        # Secrets R2 absents => mode legacy (R2_DISABLED) : rien ne change, la
        # base reste committée. Secrets posés => R2 devient la source de vérité :
        # amorçage UNIQUE depuis la copie Git au premier passage, puis
        # téléchargement vérifié (SHA-256 + intégrité SQLite) à chaque passe.
        # Toute anomalie fait ÉCHOUER le job : on ne repart jamais d'une base
        # périmée ou vide.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCESS_KEY_ID$R2_SECRET_ACCESS_KEY$R2_BUCKET" ]; then
            pip install -q "boto3>=1.36,<2"
          fi
          python -m turf_lab.r2_store pull --db turf_bench.db

      - name: Run Turf Prediction Engine (verrouillage multi-horizon T_MATIN/T90/T30/T15)
        # Pont RADAR_V4 (4e moteur du banc) : les trois secrets sont posés dans
        # GitHub → Settings → Secrets and variables → Actions. Absents => pont
        # désactivé proprement (RADAR_BRIDGE_DISABLED), rien d'autre ne change.
        env:
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_PUBLISHABLE_KEY: ${{ secrets.RADAR_PUBLISHABLE_KEY }}
          RADAR_BRIDGE_TOKEN: ${{ secrets.RADAR_BRIDGE_TOKEN }}
        run: |
          # Ancres du matin (08h30) et du soir (21h30) : fenêtre complète de 7 jours.
          # TOUTES les autres passes (crons live ET frappes du métronome
          # n8n/Cloudflare via workflow_dispatch) : journée en cours uniquement,
          # pour rester rapides et ne jamais engorger la file d'attente.
          if [ "${{ github.event.schedule }}" = "30 8 * * *" ] || [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then
            DAYS=7
          else
            DAYS=1
          fi
          echo "[*] Fenêtre de synchronisation : $DAYS jour(s)"
          # Suivi des corrections (livrable partenaire) : lancement manuel avec
          # l'entrée verify_days => relecture des arrivées (provisoire ->
          # définitive, compléments, corrections, annulations) à raison d'une
          # requête par jour, puis passe normale du jour.
          if [ -n "${{ github.event.inputs.verify_days }}" ]; then
            echo "[*] Re-vérification des arrivées sur ${{ github.event.inputs.verify_days }} jour(s)"
            python main.py --action verify --days "${{ github.event.inputs.verify_days }}"
          fi
          python main.py --action sync --days $DAYS

      - name: Persist Database to Cloudflare R2 (source de vérité + sauvegarde du jour)
        # Refuse (job rouge) toute base qui aurait perdu des éditions, courses,
        # arrivées ou photographies de cotes depuis le pull, ou une base
        # distante modifiée pendant la passe. Dans ce cas rien n'est committé
        # ni déployé : le site ne montre jamais un état non persisté.
        if: env.R2_MODE == 'r2'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python -m turf_lab.r2_store push --db turf_bench.db

      - name: Commit & Push Updated Database (Persistance définitive de l'historique)
        run: |
          git config --global user.name "Turf-Automation-Bot"
          git config --global user.email "bot@elite-turf.fr"
          if [ "$R2_MODE" = "r2" ]; then
            # La base vit sur R2 : la copie Git reste figée à l'amorçage. On la
            # restaure pour garder l'arbre propre (le rebase refuse un fichier
            # suivi modifié) et on ne committe plus que les exports légers.
            git checkout -- turf_bench.db
            git add benchmark_report.json benchmark_dashboard.html site/
          else
            git add turf_bench.db benchmark_report.json benchmark_dashboard.html site/
          fi
          # Ne committe que s'il y a un vrai changement (évite les commits vides)
          if git diff --staged --quiet; then
            echo "[*] Aucun changement à committer."
            exit 0
          fi
          git commit -m "Auto-sync PMU multi-horizon [skip ci]"
          # Push robuste : jamais de force-push, 3 tentatives avec rebase.
          # En cas d'échec définitif le job ÉCHOUE (visible), au lieu de perdre
          # silencieusement les données comme avec l'ancien '|| true'.
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "[+] Push réussi."
              exit 0
            fi
            echo "[!] Push refusé (tentative $i/3), rebase sur origin/main..."
            git pull --rebase origin main || git rebase --abort
            sleep 10
          done
          echo "[ERREUR] Impossible de pousser la base après 3 tentatives."
          exit 1

      - name: Deploy to Cloudflare Pages (prono.elite-turf.fr)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Déploiement via l'outil OFFICIEL Cloudflare (wrangler) : fiable,
          # multi-fichiers (index.html + archives mensuelles), et surtout un
          # échec est VISIBLE (le job passe au rouge) au lieu d'être avalé
          # silencieusement comme avec l'ancien appel API maison.
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy site --project-name=prono-elite-turf --branch=main --commit-dirty=true
